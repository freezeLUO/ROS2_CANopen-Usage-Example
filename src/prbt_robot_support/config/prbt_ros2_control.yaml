controller_manager:
    ros__parameters:
        update_rate: 100  # Hz

        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster

        arm_controller:
            type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
    ros__parameters:
        joints:
            - prbt_joint_1
            - prbt_joint_2
            - prbt_joint_3
            - prbt_joint_4
        command_interfaces:
            - position
        state_interfaces:
            - position
            - velocity
        stop_trajectory_duration: 0.2
        state_publish_rate:  100.0
        action_monitor_rate: 25.0
        goal_time: 0.0
        limits:
            prbt_joint_1:
                has_acceleration_limits: true
                max_acceleration: 6.0
            prbt_joint_2:
                has_acceleration_limits: true
                max_acceleration: 6.0
            prbt_joint_3:
                has_acceleration_limits: true
                max_acceleration: 6.0
            prbt_joint_4:
                has_acceleration_limits: true
                max_acceleration: 6.0